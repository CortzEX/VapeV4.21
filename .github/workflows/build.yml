name: Build Vape V4.21

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.2.2
      with:
        submodules: recursive

    # 1. إعداد MSBuild
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2.0.0

    # 2. البحث عن ملف .sln أو .vcxproj وبناؤه تلقائياً
    - name: Build Solution
      run: |
        Get-ChildItem -Include *.sln, *.vcxproj -Recurse | ForEach-Object {
          msbuild $_.FullName /p:Configuration=Release /p:Platform=x64
        }
      shell: powershell

    # 3. رفع الملفات الناتجة (DLL/EXE)
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4.4.3
      with:
        name: VapeV4-Compiled
        path: |
          **/*.dll
          **/*.exe
